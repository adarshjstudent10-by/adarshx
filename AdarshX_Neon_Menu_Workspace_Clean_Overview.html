.mark.avatar-mark{width:48px;height:58px;overflow:hidden;padding:0;border-radius:15px;background:#08122b;border:1px solid #7c3aed;box-shadow:0 0 18px #7c3aed66,0 0 28px #06b6d422;position:relative}
.avatar-mark img{width:100%;height:100%;object-fit:cover;object-position:38% 20%;filter:saturate(1.18);transform:scale(1.18)}
.nav button{border-radius:12px;transition:transform .22s ease,background .22s ease,border-color .22s ease,box-shadow .22s ease}
.nav button.active{border-color:#8b5cf7a8;background:linear-gradient(100deg,#8b5cf74a,#06b6d41b);box-shadow:inset 3px 0 #c084fc,0 0 22px #7c3aed20;color:#fff}
.nav button:hover{transform:translateX(3px);border-color:#22d3ee55;box-shadow:0 0 18px #22d3ee12}
.main{position:relative}.topbar{background:#050817d9;border-bottom-color:#31549b88;box-shadow:0 10px 35px #02061740}
.clock,.study-clock{background:linear-gradient(120deg,#0c1940e8,#07172be8);border-color:#247fbd88;box-shadow:inset 0 1px #ffffff10,0 0 24px #06b6d416}
.card{position:relative;border-color:#334d93a6;background:linear-gradient(145deg,#0c1836f2,#071126f2);box-shadow:0 18px 45px #0005,inset 0 1px #ffffff08;transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease}
.card:hover{border-color:#8b5cf7b0;box-shadow:0 18px 48px #0006,0 0 25px #6d28d91c,inset 0 1px #ffffff10}

.hero:before{background:radial-gradient(ellipse at 85% 50%,#8b5cf74a,transparent 38%),linear-gradient(115deg,#22d3ee10,transparent)}
.btn{background:linear-gradient(110deg,#9333ea,#4f46e5 52%,#0891b2);border-color:#a5b4fc55;box-shadow:0 7px 24px #6d28d933;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
.btn:after{content:"";position:absolute;inset:-80% auto -80% -35%;width:25%;transform:rotate(22deg);background:#ffffff38;transition:left .5s ease;pointer-events:none}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px #7c3aed55,0 0 18px #22d3ee22}.btn:hover:after{left:125%}
.icon-btn,.search-btn,.watch-control,.action,.preset{border-color:#31549b;background:#091733;color:#dce8ff;transition:all .2s ease}.icon-btn:hover,.search-btn:hover,.watch-control:hover,.action:hover,.preset:hover{border-color:#22d3ee;box-shadow:0 0 16px #22d3ee22;color:white;transform:translateY(-1px)}
.row{background:linear-gradient(100deg,#0a1a37c9,#07142ac9);border-color:#2344788c;transition:transform .2s ease,border-color .2s ease,background .2s ease}.row:hover{transform:translateY(-2px);border-color:#22d3ee88;background:#0c2042}
.subject:hover{transform:translateY(-5px);border-color:#22d3ee;box-shadow:0 12px 35px #7c3aed2a}
.side-note{background:linear-gradient(135deg,#4c1d951c,#0891b21c);border-color:#6d54ff77;box-shadow:inset 0 1px #ffffff0c}
.input,.select,.textarea{background:#040b1bd9;border-color:#29457d}.input:focus,.select:focus,.textarea:focus{border-color:#22d3ee;box-shadow:0 0 0 3px #22d3ee18}
.pill.violet{border-color:#a855f777;color:#d8b4fe;background:#7e22ce1c}.progress span{box-shadow:0 0 12px #22d3ee55}
.footer{color:#8199d2}.live-dot{box-shadow:0 0 12px var(--mint);animation:live-pulse 1.8s ease-in-out infinite}@keyframes live-pulse{50%{box-shadow:0 0 3px var(--mint);opacity:.7}}
@media(prefers-reduced-motion:reduce){body:before,.live-dot{animation:none!important}*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>

<style id="workspace-tabs-style">
.workspace-tabs{display:none;align-items:center;gap:8px;padding:10px 12px;margin:0 0 18px;border:1px solid rgba(115,95,255,.32);border-radius:18px;background:linear-gradient(120deg,rgba(12,18,48,.88),rgba(8,24,42,.82));box-shadow:0 8px 28px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.04);overflow-x:auto;scrollbar-width:thin;backdrop-filter:blur(16px)}
.workspace-tabs.visible{display:flex}
.workspace-tabs button{flex:0 0 auto;white-space:nowrap;border:1px solid rgba(108,139,255,.2);border-radius:12px;padding:10px 14px;color:#b8c9f8;background:rgba(8,18,46,.65);font:inherit;font-size:.88rem;cursor:pointer;transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease}
.workspace-tabs button:hover{transform:translateY(-2px);border-color:#55eaff;color:#fff;box-shadow:0 0 18px rgba(85,234,255,.16)}
.workspace-tabs button.active{color:#fff;border-color:#a78bfa;background:linear-gradient(110deg,rgba(139,92,246,.3),rgba(34,211,238,.16));box-shadow:0 0 18px rgba(139,92,246,.22),inset 0 0 14px rgba(34,211,238,.06)}
.workspace-tabs button:focus-visible{outline:2px solid #55eaff;outline-offset:3px}
@media(max-width:600px){.workspace-tabs{margin-bottom:12px;padding:8px;border-radius:14px}.workspace-tabs button{padding:9px 11px;font-size:.82rem}}
@media(prefers-reduced-motion:reduce){.workspace-tabs button{transition:none}.workspace-tabs button:hover{transform:none}}

.study-workspace-menu{background:linear-gradient(100deg,rgba(139,92,246,.12),rgba(34,211,238,.05))!important;border-color:rgba(139,92,246,.18)!important;color:#e3e8ff!important}
.study-workspace-menu:hover{border-color:#55eaff66!important;box-shadow:0 0 18px #55eaff12}
</style>
</head>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const iso=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const id=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt=(s,opts={day:'numeric',month:'short',year:'numeric'})=>s?new Intl.DateTimeFormat(undefined,opts).format(new Date(s+'T12:00:00')):'No date';
const timeFmt=s=>{if(!s)return 'Flexible time';let [h,m]=s.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const mins=n=>{n=Math.max(0,Math.round(Number(n)||0));return n>=60?`${Math.floor(n/60)}h ${n%60}m`:`${n}m`};
const base=()=>({version:2,settings:{name:'',format:'12',seconds:true,timezone:true,timezoneName:'Asia/Kolkata',theme:'dark',compact:false,reduced:false,goal:360,focus:25,short:5,long:15,targets:{Mathematics:120,Science:120,'Social Science':120,SST:120,English:0,Hindi:0,IT:0}},profile:{grade:'Class 10',board:'CBSE'},subjects:[],tasks:[],notes:[],events:[],blocks:[],assignments:[],exams:[],resources:[],sessions:[],syllabus:[],folders:[],alarms:[],studyPlan:[],planWindowVersion:0,onboarded:false});
let state=(()=>{try{let s=JSON.parse(localStorage.getItem('deltaStudyData')||'null');return s&&[1,2].includes(s.version)?{...base(),...s,version:2,settings:{...base().settings,...s.settings,targets:{...base().settings.targets,...(s.settings?.targets||{})}},profile:{...base().profile,...s.profile},syllabus:Array.isArray(s.syllabus)?s.syllabus:[],folders:Array.isArray(s.folders)?s.folders:[],alarms:Array.isArray(s.alarms)?s.alarms:[]}:base()}catch{return base()}})();
// Defensive schema normalization keeps older/local backups usable and avoids malformed records crashing renderers.
for(const key of ['subjects','tasks','notes','events','blocks','assignments','exams','resources','sessions','syllabus','folders','alarms','studyPlan']) if(!Array.isArray(state[key])) state[key]=[];
state.subjects.forEach(s=>{if(!Array.isArray(s.chapters))s.chapters=[];});
for(const key of ['subjects','tasks','notes','events','blocks','assignments','exams','resources','sessions','syllabus','folders','alarms','studyPlan']){
  const seen=new Set();state[key]=state[key].filter(x=>{if(!x||typeof x!=='object')return false;if(!x.id)x.id=id();if(seen.has(x.id))return false;seen.add(x.id);return true;});
}
{
  const byKey=new Map(),merged=[];
  for(const c of state.syllabus){const k=String(c.subject||'').toLowerCase()+'|'+String(c.name||'').trim().toLowerCase();if(!c.name)continue;const old=byKey.get(k);if(!old){byKey.set(k,c);merged.push(c);continue;}if(c.status==='Completed'||(c.status==='In Progress'&&old.status==='Not Started'))old.status=c.status;old.difficult=!!(old.difficult||c.difficult);old.notes=old.notes||c.notes||'';if(!old.targetDate||(c.targetDate&&c.targetDate<old.targetDate))old.targetDate=c.targetDate;}
  state.syllabus=merged;
}
let ui={planFilter:'All',sylSubject:'All',sylFilter:'All',sylQuery:'',resFolder:'All',resQuery:'',resSubject:'All',resSort:'title',taskFilter:'All',blockDay:String(new Date().getDay()),resourceViewerUrl:'',resourceViewerTitle:'',resourceHistory:[],resourceHistoryIndex:-1};
let page='overview',cursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),selected=iso(),edit=null;
let studyWatch={elapsed:0,runningSince:0,status:'idle',segmentStart:0};
try{const w=JSON.parse(localStorage.getItem('adarshXStudyWatch')||'null');if(w&&Number.isFinite(w.elapsed)&&['idle','running','paused'].includes(w.status)){studyWatch={...studyWatch,...w};if(studyWatch.status==='running'&&!studyWatch.runningSince)studyWatch.runningSince=Date.now();}}catch{}
function watchSeconds(){return Math.max(0,Math.floor((studyWatch.elapsed+(studyWatch.status==='running'?Date.now()-studyWatch.runningSince:0))/1000));}
function watchText(){const n=watchSeconds(),h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function watchPersist(){try{localStorage.setItem('adarshXStudyWatch',JSON.stringify({elapsed:studyWatch.elapsed,runningSince:studyWatch.runningSince,status:studyWatch.status,segmentStart:studyWatch.segmentStart}));}catch{}}
function recordWatchSegment(){if(studyWatch.status!=='running'||!studyWatch.runningSince)return;const seconds=Math.max(0,Math.floor((Date.now()-studyWatch.runningSince)/1000));if(seconds>=30){state.sessions.push({id:id(),subjectId:$('#focusSubject')?.value||'',date:iso(new Date(studyWatch.segmentStart||studyWatch.runningSince)),started:new Date(studyWatch.runningSince).toISOString(),minutes:seconds/60,type:'study',source:'stopwatch'});save();}studyWatch.elapsed+=Date.now()-studyWatch.runningSince;studyWatch.runningSince=0;studyWatch.segmentStart=0;}
function watchToggle(){if(studyWatch.status==='running'){recordWatchSegment();studyWatch.status='paused';}else{studyWatch.status='running';studyWatch.runningSince=Date.now();studyWatch.segmentStart=studyWatch.runningSince;}watchPersist();updateWatchUI();}
function watchReset(){if(studyWatch.status==='running')recordWatchSegment();studyWatch.elapsed=0;studyWatch.runningSince=0;studyWatch.segmentStart=0;studyWatch.status='idle';watchPersist();updateWatchUI();if(page==='overview'||page==='analytics')render();}
function updateWatchUI(){const text=watchText();['studyWatch','viewerWatch'].forEach(k=>{const e=document.getElementById(k);if(e)e.textContent=text});['watchToggle','viewerWatchToggle'].forEach(k=>{const e=document.getElementById(k);if(e)e.textContent=studyWatch.status==='running'?'Pause':studyWatch.status==='paused'?'Resume':'Start'});}
let timer={mode:'pomodoro',status:'idle',duration:state.settings.focus*60,remaining:state.settings.focus*60,deadline:0,started:0,elapsed:0,sessionStart:0,subjectId:'',taskId:'',break:false,interval:null};
function persistTimer(){try{const snap={};['mode','status','duration','remaining','deadline','started','elapsed','sessionStart','subjectId','taskId','break'].forEach(k=>snap[k]=timer[k]);localStorage.setItem('deltaStudyTimer',JSON.stringify(snap));}catch{}}
try{const snap=JSON.parse(localStorage.getItem('deltaStudyTimer')||'null');if(snap&&['pomodoro','stopwatch','custom'].includes(snap.mode)&&['idle','running','paused'].includes(snap.status)){Object.assign(timer,snap,{interval:null});if(timer.status==='running'&&timer.mode!=='stopwatch')timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));}}catch{}

function save(){try{localStorage.setItem('deltaStudyData',JSON.stringify(state));return true}catch{toast('Could not save: browser storage may be unavailable or full.','error');return false}}
function toast(msg,type=''){let e=document.createElement('div');e.className='toast '+type;e.textContent=msg;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
function settingsApply(){document.body.classList.toggle('light',state.settings.theme==='light');document.body.classList.toggle('compact',state.settings.compact);document.body.classList.toggle('reduce-motion',state.settings.reduced)}
const meta={overview:['Overview','Your personal learning command center'],calendar:['Calendar','Dates, deadlines, and events in one place'],subjects:['Subjects','Build your learning map, one chapter at a time'],syllabus:['Syllabus tracker','36-day CBSE Class 10 plan · 26 October–30 November 2026'],timetable:['Timetable','Give your study time a clear structure'],tasks:['Study planner','Turn intentions into actionable next steps'],notes:['Notes','Your personal knowledge library'],assignments:['Assignments','Keep every deadline visible'],exams:['Exams','Prepare deliberately, revise consistently'],focus:['Focus room','A calmer space for concentrated work'],analytics:['Analytics','Understand the work you have actually done'],resources:['Resources','A curated shelf for your learning links'],settings:['Settings','Make your workspace work for you']};
function clock(){let d=new Date(),tz=state.settings.timezoneName||'Asia/Kolkata',o={hour:'2-digit',minute:'2-digit',hour12:state.settings.format!=='24',timeZone:tz};if(state.settings.seconds)o.second='2-digit';$('#time').textContent=new Intl.DateTimeFormat(undefined,o).format(d);$('#date').textContent=new Intl.DateTimeFormat('en-IN',{weekday:'short',day:'numeric',month:'short',timeZone:tz}).format(d)+(state.settings.timezone?' · '+tz:'');$('#year').textContent='© '+d.getFullYear();let g=$('#greeting');if(g)g.textContent=d.getHours()<12?'Good morning':d.getHours()<18?'Good afternoon':'Good evening';const vt=$('#viewerTime'),vd=$('#viewerDate');if(vt)vt.textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:state.settings.format!=='24'}).format(d);if(vd)vd.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(d);updateWatchUI()}
setInterval(clock,1000);settingsApply();clock();
function go(p){if(!meta[p])return;page=p;location.hash=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=meta[p][0];$('#pageSub').textContent=meta[p][1];render();$('#sidebar').classList.remove('open');$('#sideBack').classList.remove('open');window.scrollTo({top:0,behavior:state.settings.reduced?'auto':'smooth'})}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#workspaceTabs').addEventListener('click',e=>{const b=e.target.closest('[data-workspace-tab]');if(b)go(b.dataset.workspaceTab)});$$('[data-page="settings"]').forEach(b=>b.onclick=()=>go('settings'));
$('#menu').onclick=()=>{if(innerWidth<=820){$('#sidebar').classList.toggle('open');$('#sideBack').classList.toggle('open')}else $('#app').classList.toggle('collapsed')};$('#sideBack').onclick=()=>{$('#sidebar').classList.remove('open');$('#sideBack').classList.remove('open')};
window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(meta[p]&&p!==page){page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=meta[p][0];$('#pageSub').textContent=meta[p][1];render()}});
const head=(ey,title,desc,actions='')=>`<div class="head"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="subtext">${desc}</p></div><div class="toolbar">${actions}</div></div>`;
const button=(text,action,cls='btn')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
const empty=(title,desc,action='')=>`<div class="empty"><strong>${title}</strong>${desc}${action?`<div style="margin-top:13px">${action}</div>`:''}</div>`;
const subName=sid=>state.subjects.find(s=>s.id===sid)?.name||'General';
const subjectOptions=sid=>`<option value="">No subject</option>`+state.subjects.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('');
const focusToday=()=>state.sessions.filter(s=>s.date===iso()&&s.type==='study').reduce((a,s)=>a+s.minutes,0);
function overviewBase(){let fm=focusToday(),goal=state.settings.goal,pct=Math.min(100,Math.round(fm/goal*100)),pending=state.tasks.filter(t=>t.status!=='Completed').length,upcoming=state.exams.filter(e=>e.date>=iso()).length;let todayItems=[...state.tasks.filter(t=>t.due===iso()),...state.events.filter(e=>e.date===iso())].sort((a,b)=>(a.time||a.start||'').localeCompare(b.time||b.start||''));return `<section class="card hero"><div><div class="eyebrow" id="greeting">Good day</div><h1>Your Focus.<br><em>Your Future.</em></h1><p class="subtext">One calm, intelligent workspace for every subject, every session, and every goal. Make today count, one focused block at a time.</p><div class="hero-actions">${button('◎ Start studying','start-focus')}${button('＋ Plan my day','new-task','btn secondary')}${button('▤ Syllabus','go-syllabus','btn secondary')}${button('＋ Add note','new-note','btn secondary')}${button('↗ Add resource','new-resource','btn secondary')}</div></div><div class="art"><div class="orbit"></div><div class="planet"></div><div class="book-3d" aria-hidden="true"><div class="book-pages"></div><div class="book-cover"></div><svg viewBox="0 0 54 76" xmlns="http://www.w3.org/2000/svg"><path d="M13 20h27M13 27h22M13 34h24" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/><path d="M10 8v60" stroke="#fff" stroke-width="1" opacity=".25"/></svg></div><div class="tag a">TODAY'S FOCUS<strong>${mins(fm)}</strong></div><div class="tag b">DAILY TARGET<strong>${pct}% complete</strong></div></div></section>

function renderCalendarGrid(){let grid=$('#calGrid');if(!grid)return;let y=cursor.getFullYear(),m=cursor.getMonth();$('#monthTitle').textContent=new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(cursor);let week=state.settings.weekStart===1?1:0,offset=(new Date(y,m,1).getDay()-week+7)%7,labels=week?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];grid.innerHTML=labels.map(x=>`<div class="day-label">${x}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(y,m,1-offset+i),s=iso(d),count=state.events.filter(x=>x.date===s).length+state.tasks.filter(x=>x.due===s).length+state.exams.filter(x=>x.date===s).length+state.assignments.filter(x=>x.date===s).length,b=document.createElement('button');b.className='cal-cell'+(s===iso()?' today':'')+(s===selected?' selected':'')+(d.getMonth()!==m?' outside':'');b.innerHTML=d.getDate()+(count?'<br>'+('<i class="event-dot"></i>'.repeat(Math.min(4,count))):'');b.setAttribute('aria-label',dateFmt(s,{weekday:'long',day:'numeric',month:'long'}));b.onclick=()=>{selected=s;renderCalendarGrid();$('#selectedLabel').textContent=dateFmt(s,{weekday:'long',day:'numeric',month:'long'});$('#agenda').innerHTML=agenda(s)};grid.append(b)}$('#prevMonth').onclick=()=>{cursor=new Date(y,m-1,1);renderCalendarGrid()};$('#nextMonth').onclick=()=>{cursor=new Date(y,m+1,1);renderCalendarGrid()};$('#todayBtn').onclick=()=>{cursor=new Date();cursor.setDate(1);selected=iso();renderCalendarGrid();$('#selectedLabel').textContent=dateFmt(selected,{weekday:'long',day:'numeric',month:'long'});$('#agenda').innerHTML=agenda(selected)}}
function agenda(s){let a=[...state.events.filter(x=>x.date===s).map(x=>({...x,kind:'Event'})),...state.tasks.filter(x=>x.due===s).map(x=>({...x,kind:'Task'})),...state.assignments.filter(x=>x.date===s).map(x=>({...x,kind:'Assignment'})),...state.exams.filter(x=>x.date===s).map(x=>({...x,kind:'Exam'}))].sort((x,y)=>(x.start||x.time||'').localeCompare(y.start||y.time||''));return a.length?`<div class="list">${a.map(x=>`<div class="row"><div class="row-icon">▦</div><div class="row-main"><div class="row-title">${esc(x.title)}</div><div class="row-meta">${x.kind} · ${timeFmt(x.start||x.time)}</div></div></div>`).join('')}</div>`:empty('Nothing on this date','Add an event or schedule a task to make a plan.')}

function focusPage(){return `${head('DEEP WORK','Focus room','Choose a subject, set a session, and protect your attention.',button('Go to subjects','go-subjects','btn secondary'))}<div class="grid timer-layout"><section class="card timer-card"><div class="eyebrow">FOCUS TIMER</div><div class="preset-row"><button class="preset ${timer.mode==='pomodoro'?'active':''}" data-mode="pomodoro">Pomodoro</button><button class="preset ${timer.mode==='stopwatch'?'active':''}" data-mode="stopwatch">Stopwatch</button><button class="preset ${timer.mode==='custom'?'active':''}" data-mode="custom">Custom</button></div><div class="timer-ring"><svg viewBox="0 0 200 200"><circle class="timer-track" cx="100" cy="100" r="90"/><circle class="timer-progress" id="ring" cx="100" cy="100" r="90"/></svg><div><div class="timer-display" id="timerDisplay">25:00</div><div class="timer-mode" id="timerMode">READY TO FOCUS</div></div></div><div class="preset-row" id="presets"><button class="preset active" data-preset="focus">25 min focus</button><button class="preset" data-preset="short">5 min break</button><button class="preset" data-preset="long">15 min break</button></div><div class="timer-controls"><button class="btn" id="timerStart">▶ Start session</button><button class="btn secondary" id="timerFinish">✓ Finish & save</button><button class="btn secondary" id="timerReset">↺ Reset</button></div><p class="subtext" style="margin-top:16px;max-width:350px">Timestamp-based timing stays accurate when switching tabs. Breaks are not counted as study time.</p></section><section class="card pad"><div class="card-head"><div><h2>Session setup</h2><p>Make this block specific</p></div><span class="pill">Local session</span></div><div class="field"><label>Subject</label><select class="select" id="focusSubject">${subjectOptions(timer.subjectId)}</select></div><div class="field"><label>Current task (optional)</label><select class="select" id="focusTask"><option value="">Choose a task</option>${state.tasks.filter(t function startTimer(){if(timer.status==='running'){pauseTimer();return}if(timer.mode==='custom'&&timer.status==='idle'){let m=Number($('#customMinutes')?.value||25);if(!Number.isFinite(m)||m<1||m>600){toast('Choose 1–600 minutes.','error');return}timer.duration=m*60;timer.remaining=timer.duration}timer.subjectId=$('#focusSubject')?.value||timer.subjectId;timer.taskId=$('#focusTask')?.value||timer.taskId;if(timer.status==='paused'){if(timer.mode==='stopwatch')timer.started=Date.now();else timer.deadline=Date.now()+timer.remaining*1000}else{timer.sessionStart=Date.now();timer.elapsed=0;if(timer.mode==='stopwatch')timer.started=Date.now();else timer.deadline=Date.now()+timer.remaining*1000}timer.status='running';clearInterval(timer.interval);timer.interval=setInterval(tick,250);persistTimer();timerUI()}

function stopTimer(record=true){if(timer.status==='running'){if(timer.mode==='stopwatch')timer.elapsed+=Math.floor((Date.now()-timer.started)/1000);else timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000))}clearInterval(timer.interval);timer.interval=null;if(record&&timer.sessionStart){let seconds=timer.mode==='stopwatch'?timer.elapsed:timer.duration-timer.remaining;if(!timer.break&&seconds>=30){state.sessions.push({id:id(),subjectId:timer.subjectId,date:iso(new Date(timer.sessionStart)),started:new Date(timer.sessionStart).toISOString(),minutes:Math.floor(seconds/60),type:'study'});save();toast(`Session recorded: ${mins(Math.floor(seconds/60))}`)}}timer.status='idle';timer.sessionStart=0;timer.started=0;timer.deadline=0;timer.elapsed=0;timer.remaining=timer.duration;persistTimer();timerUI()}
function tick(){if(timer.status!=='running')return;if(timer.mode!=='stopwatch'){timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.remaining===0){clearInterval(timer.interval);timer.interval=null;timer.status='idle';if(!timer.break&&timer.sessionStart){state.sessions.push({id:id(),subjectId:timer.subjectId,date:iso(new Date(timer.sessionStart)),started:new Date(timer.sessionStart).toISOString(),minutes:Math.floor(timer.duration/60),type:'study'});save();toast('Focus session complete. Take a break.')}else toast('Timer complete.');timer.sessionStart=0;timer.started=0;timer.deadline=0;let wasBreak=timer.break;if(timer.mode==='pomodoro'){timer.break=!wasBreak;timer.duration=(timer.break?state.settings.short:state.settings.focus)*60;timer.remaining=timer.duration;$$('[data-preset]').forEach(b=>b.classList.toggle('active',b.dataset.preset===(timer.break?'short':'focus')))}else timer.remaining=timer.duration}}persistTimer();timerUI();if(page==='overview'||page==='analytics')render()}

function ensureFolders(){const seen=new Map(),keep=[];for(const f of state.folders){const k=String(f.name||'General').trim().toLowerCase();if(seen.has(k)){const canonical=seen.get(k);state.resources.forEach(r=>{if(r.folderId===f.id)r.folderId=canonical.id});continue;}f.name=String(f.name||'General').trim();seen.set(k,f);keep.push(f);}state.folders=keep;const general=state.folders.find(f=>f.name.toLowerCase()==='general');if(general)general.name='General';['Mathematics','Science','SST','English','Hindi','IT','General'].forEach(n=>{if(!state.folders.some(f=>f.name.toLowerCase()===n.toLowerCase()))state.folders.push({id:id(),name:n,created:Date.now()})});}function seedSyllabus(){ensureFolders();if(state.syllabus.length){save();return;}Object.entries(starterSyllabus).forEach(([subject,names])=>names.forEach((name,i)=>state.syllabus.push({id:id(),subject,name,status:'Not Started',targetDate:new Date(Date.parse(SYLLABUS_START+'T12:00:00')+Math.round(i/(names.length-1||1)*35)*86400000).toISOString().slice(0,10),difficult:false,notes:'',category:name.includes(':')?name.split(':')[0]:''})));state.version=2;save()}

  <section class="card pad" style="margin-top:15px"><h2>Daily targets</h2><p class="subtext">Mathematics 120 min · Science 120 min · Social Science 120 min · 360 focused minutes total.</p><div class="toolbar"><span class="pill">Mathematics: 120 min/day</span><span class="pill">Science: 120 min/day</span><span class="pill">SST: 120 min/day</span></div></section>`
}
function syllabusEditor(cid=null){let c=state.syllabus.find(x=>x.id===cid),f=(n,l,t='text',v='',extra={})=>field(n,l,t,v,extra),body=f('name','Chapter / topic','text',c?.name||'',{required:true,full:true})+f('subject','Subject','select',c?.subject||'Mathematics',{options:['Mathematics','Science','SST'].map(n=>`<option ${n===(c?.subject||'Mathematics')?'selected':''}>${n}</option>`).join('')})+f('status','Status','select',c?.status||'Not Started',{options:['Not Started','In Progress','Completed','Needs Revision'].map(n=>`<option ${n===(c?.status||'Not Started')?'selected':''}>${n}</option>`).join('')})+f('targetDate','Target completion date','date',c?.targetDate||SYLLABUS_END)+f('category','Category / unit','text',c?.category||'')+f('notes','Revision notes','textarea',c?.notes||'',{full:true})+`<div class="field"><label><input type="checkbox" name="difficult" ${c?.difficult?'checked':''}> Mark as difficult</label></div>`;modal(c?'Edit chapter':'Add chapter',body,'Save chapter',d=>{if(!d.name.trim())return false;let v={...c,id:c?.id||id(),name:d.name.trim(),subject:d.subject,status:d.status,targetDate:d.targetDate||'',category:d.category||'',notes:d.notes||'',difficult:$('#formBody [name=difficult]').checked};state.syllabus=c?state.syllabus.map(x=>x.id===c.id?v:x):[...state.syllabus,v];save();toast('Chapter saved');return true})}
const PLAN_SUBJECTS=['Mathematics','Science','SST'];
const PLAN_START=SYLLABUS_START,PLAN_END=SYLLABUS_END,PLAN_DAYS=36,PLAN_CYCLES=Math.floor(PLAN_DAYS/2);
function chaptersFor(subject){return state.syllabus.filter(c=>c.subject===subject&&String(c.name||'').trim()).sort((a,b)=>{const base=(starterSyllabus[subject]||[]),ai=base.indexOf(a.name),bi=base.indexOf(b.name);if(ai!==-1||bi!==-1)return (ai===-1?9999:ai)-(bi===-1?9999:bi);return String(a.created||a.id||'').localeCompare(String(b.created||b.id||''))})}
function dayISO(n){const d=new Date(PLAN_START+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function planDayIndex(date){return Math.max(0,Math.min(PLAN_DAYS-1,Math.round((new Date(date+'T12:00:00')-new Date(PLAN_START+'T12:00:00'))/86400000)))}
function planDate(){const t=iso();return t<PLAN_START?PLAN_START:t>PLAN_END?PLAN_END:t}
function planModel(){const counts=Object.fromEntries(PLAN_SUBJECTS.map(n=>[n,chaptersFor(n).length])),max=Math.max(0,...Object.values(counts)),cycles=Math.min(PLAN_CYCLES,max),requiredDays=max*2,unassigned=Object.fromEntries(PLAN_SUBJECTS.map(n=>[n,chaptersFor(n).slice(PLAN_CYCLES)]));return {counts,cycles,max,requiredDays,revisionDays:Math.max(0,PLAN_DAYS-requiredDays),unassigned,overCapacity:requiredDays>PLAN_DAYS}}
function makePlanTask(subject,date,chapter,index,oldTasks){const old=oldTasks.find(t=>(t.plannedDate||t.date)===date&&t.subject===subject&&((chapter&&t.chapterId===chapter.id)||(!t.chapterId&&chapter&&t.title===chapter.name)||(!chapter&&t.kind===(index>=chaptersFor(subject).length?'revision':'practice'))));const kind=chapter?'chapter':index>=chaptersFor(subject).length?'revision':'practice';const title=chapter?chapter.name:(kind==='revision'?'Full syllabus revision: difficult topics, key concepts and error log':(index%2?'Timed practice questions and corrections':'Mixed practice / competency questions'));return {...old,id:old?.id||id(),subject,chapterId:chapter?.id||'',title:old?.title||title,mode:old?.mode||(chapter?'Learn chapter + NCERT examples, then practice':'Revision / practice / mock-test preparation'),kind,date:(old?.rescheduledFrom&&old?.date)?old.date:date,plannedDate:old?.plannedDate||date,status:old?.status||'Not Started',minutes:120,optional:false,difficult:!!chapter?.difficult,notes:old?.notes||'',targetDate:chapter?.targetDate||date,completedAt:old?.completedAt||'',rescheduledFrom:old?.rescheduledFrom||'',rescheduleCount:old?.rescheduleCount||0}}
function seedStudyPlan(){
 const old=Array.isArray(state.studyPlan)?state.studyPlan:[],next=[],model=planModel();
 for(let cycle=0;cycle<PLAN_CYCLES;cycle++){
  const firstDay=cycle*2;
  for(const subject of PLAN_SUBJECTS){const chapters=chaptersFor(subject),chapter=chapters[cycle]||null;
   for(let offset=0;offset<2;offset++){const date=dayISO(firstDay+offset),task=makePlanTask(subject,date,chapter,cycle,old);if(offset===1&&chapter&&(!old.some(t=>(t.plannedDate||t.date)===date&&t.subject===subject&&t.chapterId===chapter.id&&t.title!==chapter.name))){task.title='Practice + consolidation: '+chapter.name;task.mode='NCERT exercise, active recall, 15–25 questions and error log'}if(offset===1&&!chapter){task.title=cycle>=chapters.length?'Difficult topics + revision notes':'Practice set + error corrections';task.mode=cycle>=chapters.length?'Active recall / revision':'Practice / error log'};next.push(task)}
  }
 }
 // Preserve user-created reschedules and completions without duplicate counting; keep one canonical block per planned date/subject/chapter.
 const seen=new Set(),dedup=[];for(const t of next){const k=[t.plannedDate,t.subject,t.chapterId,t.kind].join('|');if(seen.has(k))continue;seen.add(k);dedup.push(t)}
 // Keep unfinished work moved beyond the deadline as catch-up tasks; never silently drop it.
 old.filter(t=>t.date>PLAN_END&&t.status!=='Completed'&&PLAN_SUBJECTS.includes(t.subject)).forEach(t=>{const k=[t.plannedDate||t.date,t.subject,t.chapterId||'',t.kind||''].join('|');if(!dedup.some(x=>[x.plannedDate,x.subject,x.chapterId||'',x.kind||''].join('|')===k))dedup.push(t)});
 state.studyPlan=dedup;state.planWindowVersion=4;state.settings.goal=360;state.settings.targets={...state.settings.targets,Mathematics:120,Science:120,SST:120,'Social Science':120,English:0,Hindi:0,IT:0};save();
}
seedStudyPlan();
function planProgress(){const core=state.studyPlan.filter(x=>!x.optional&&PLAN_SUBJECTS.includes(x.subject)&&x.date<=PLAN_END),keys=new Set(),unique=[];for(const t of core){const k=[t.plannedDate||t.date,t.subject,t.chapterId||'',t.kind||''].join('|');if(!keys.has(k)){keys.add(k);unique.push(t)}}const done=unique.filter(x=>x.status==='Completed').length;return {total:unique.length,done,pct:unique.length?Math.round(done/unique.length*100):0,remaining:unique.length-done}}
function planRows(date,compact=false){const list=state.studyPlan.filter(t=>t.date===date&&PLAN_SUBJECTS.includes(t.subject)).sort((a,b)=>PLAN_SUBJECTS.indexOf(a.subject)-PLAN_SUBJECTS.indexOf(b.subject));if(!list.length)return empty('No study blocks','Your plan will appear here.');return `<div class="list">${list.map(t=>`<div class="row"><div class="row-icon">${t.subject==='Mathematics'?'∑':t.subject==='Science'?'⚗':'◎'}</div><div class="row-main"><div class="row-title">${esc(t.title)}</div><div class="row-meta">${esc(t.subject)} · ${t.minutes||120} min · target ${dateFmt(t.targetDate||t.plannedDate||t.date)}${t.rescheduledFrom?' · moved from '+dateFmt(t.rescheduledFrom):''}${t.difficult?' · difficult':''}</div>${!compact?`<div class="row-meta">${esc(t.mode||'Study block')} · ${esc(t.status||'Not Started')}</div>`:''}<div class="toolbar" style="margin-top:7px"><button class="action" data-action="plan-edit" data-id="${t.id}">Edit task</button><button class="action" data-action="plan-date" data-id="${t.id}">Change date</button></div></div><button class="action" data-action="plan-toggle" data-id="${t.id}">${t.status==='Completed'?'✓ Completed':'Mark complete'}</button></div>`).join('')}</div>`}
function scheduleWarning(){const m=planModel(),bits=PLAN_SUBJECTS.map(n=>`${n}: ${m.counts[n]}`).join(' · '),overflow=PLAN_SUBJECTS.filter(n=>m.counts[n]>PLAN_CYCLES).map(n=>`${n} has ${m.counts[n]-PLAN_CYCLES} chapter(s) beyond the ${PLAN_CYCLES}-cycle capacity`).join('; ');return `<section class="card pad" style="margin-top:15px;border-color:${m.overCapacity?'#ffc66e66':'var(--line)'}"><div class="eyebrow">CHAPTER CAPACITY CHECK</div><h2>Chapter count and schedule fit</h2><p class="subtext">Saved chapter counts: ${bits}. The 36-day window contains ${PLAN_CYCLES} two-day cycles, so it can schedule at most ${PLAN_CYCLES} chapter slots per subject under the requested rule.</p>${m.overCapacity?`<p style="color:var(--amber)"><strong>Warning: syllabus does not fit the requested schedule.</strong> ${esc(overflow)}. Overflow chapters not scheduled in the 36-day window: ${PLAN_SUBJECTS.map(n=>m.unassigned[n].length?`${n}: ${m.unassigned[n].map(c=>c.name).join(', ')}`:'').filter(Boolean).map(esc).join(' · ')}. No chapter is marked complete automatically, and all overflow chapters remain visible in the tracker. Add days, remove only chapters confirmed outside your school’s syllabus, or change the cycle rule to fit everything.</p>`:`<p class="subtext">All saved chapter lists fit within the chapter-cycle capacity. Remaining time after the final chapter cycle: ${m.revisionDays} day(s) for revision, practice, difficult topics and mock tests.</p>`}<p class="desktop-hint">Chapter names are taken from saved tracker data. The preloaded starter list has not been treated as an official verification of every 2026–27 chapter; compare it with the official CBSE curriculum and your school’s scope before relying on it.</p><a class="btn secondary sm" href="https://cbseacademic.nic.in/curriculum_2027.html" target="_blank" rel="noopener noreferrer">↗ Official CBSE 2026–27 curriculum</a></section>`}
function dashboardPlanCards(){const date=planDate(),idx=planDayIndex(date),progress=planProgress(),fm=focusToday(),remaining=Math.max(0,Math.round((new Date(PLAN_END+'T12:00:00')-new Date(iso()+'T12:00:00'))/86400000)),scheduled=state.studyPlan.filter(t=>t.date===date&&!t.optional&&PLAN_SUBJECTS.includes(t.subject));return `<section class="card pad orbital" style="margin-top:15px"><div class="card-head"><div><div class="eyebrow">36-DAY STUDY SPRINT</div><h2>Daily command centre</h2><p>Day ${String(idx+1).padStart(2,'0')} of 36 · ${dateFmt(date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div><button class="btn secondary sm" data-action="go-syllabus">Open full plan</button></div><div class="grid stats" style="margin:0 0 14px"><div class="stat"><div class="stat-top">Core study target</div><div class="stat-value">6h</div><div class="stat-foot">2h each: Maths · Science · SST</div></div><div class="stat"><div class="stat-top">Logged today</div><div class="stat-value">${mins(fm)}</div><div class="stat-foot">${Math.max(0,360-fm)} min to daily target</div></div><div class="stat"><div class="stat-top">Plan progress</div><div class="stat-value">${progress.pct}%</div><div class="progress"><span style="width:${progress.pct}%"></span></div><div class="stat-foot">${progress.done}/${progress.total} unique blocks completed</div></div><div class="stat"><div class="stat-top">Days to deadline</div><div class="stat-value">${remaining}</div><div class="stat-foot">Deadline: 30 Nov 2026</div></div></div><div class="grid three-col">${PLAN_SUBJECTS.map(n=>{const t=scheduled.find(x=>x.subject===n);return `<div class="card pad"><div class="card-head"><h3>${esc(n==='SST'?'Social Science':n)}</h3><span class="pill violet">2h</span></div><div class="row-title">${esc(t?.title||'No block scheduled')}</div><div class="row-meta">${esc(t?.mode||'')}</div>${t?`<button class="action" style="margin-top:10px" data-action="plan-toggle" data-id="${t.id}">${t.status==='Completed'?'✓ Completed':'Mark complete'}</button>`:''}</div>`}).join('')}</div><div style="margin-top:12px"><h3>Today's timetable</h3><p class="subtext">Each core subject receives one 120-minute block. Chapter completion is never auto-marked.</p>${planRows(date,true)}</div></section>`}
function studyPlanSection(){const progress=planProgress(),filter=ui.planFilter||'All',today=planDate(),days=Array.from({length:PLAN_DAYS},(_,i)=>dayISO(i));return `<section class="card pad" style="margin-top:15px"><div class="card-head"><div><div class="eyebrow">26 OCT – 30 NOV 2026</div><h2>Daily planner · two-day chapter cycles</h2><p>Each two-day cycle assigns one chapter per subject. The second day continues practice and consolidation for the same chapter. Dates and tasks can be edited independently.</p></div><div class="pill violet">${progress.done}/${progress.total} blocks</div></div><div class="progress"><span style="width:${progress.pct}%"></span></div><div class="toolbar" style="margin:12px 0"><select class="select" id="planFilter" style="width:auto"><option ${filter==='All'?'selected':''}>All</option><option ${filter==='Today'?'selected':''}>Today</option><option ${filter==='Incomplete'?'selected':''}>Incomplete</option><option ${filter==='Tests'?'selected':''}>Tests</option></select><button class="btn secondary sm" data-action="plan-reset-filters">Show all 36 days</button></div>${days.filter(d=>filter==='All'||filter==='Today'&&d===today||filter==='Incomplete'&&state.studyPlan.some(t=>(t.plannedDate||t.date)===d&&t.status!=='Completed'&&PLAN_SUBJECTS.includes(t.subject))||filter==='Tests'&&state.studyPlan.some(t=>(t.plannedDate||t.date)===d&&/test|mock|timed/i.test((t.mode||'')+' '+(t.title||'')))).map(d=>{const list=state.studyPlan.filter(t=>t.date===d&&PLAN_SUBJECTS.includes(t.subject)),done=list.filter(t=>t.status==='Completed').length,idx=planDayIndex(d);return `<details class="card pad" style="margin:8px 0" ${filter==='Today'&&d===today?'open':''}><summary style="cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><strong>Day ${String(idx+1).padStart(2,'0')} · ${dateFmt(d,{weekday:'short',day:'numeric',month:'short'})}</strong><span class="pill ${done===list.length&&list.length?'green':'violet'}">${done}/${list.length} blocks complete</span></summary><div class="toolbar" style="margin:10px 0"><label class="desktop-hint" for="date-${d}">Edit date</label><input class="input" type="date" id="date-${d}" value="${d}" data-plan-day-date="${d}" min="${PLAN_START}" max="${PLAN_END}" style="width:auto"></div>${planRows(d)}</details>`}).join('')||empty('No days match','Try another filter.')}</section>${scheduleWarning()}`}
function syllabusPage(){return syllabusPageBase()+studyPlanSection()}
function overview(){return overviewBase()+dashboardPlanCards()}

function validResourceURL(raw){try{const u=new URL(String(raw||'').trim());return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function resourceViewer(){if(!ui.resourceViewerUrl)return '';const u=validResourceURL(ui.resourceViewerUrl);if(!u)return '';return `<section class="card pad resource-viewer" aria-label="AdarshX internal resource browser"><div class="card-head"><div><div class="eyebrow">ADARSHX BROWSER</div><h2>${esc(ui.resourceViewerTitle||'Resource viewer')}</h2></div><button class="btn secondary sm" data-viewer="close">← Return to AdarshX</button></div><div class="viewer-toolbar"><button class="btn secondary sm" data-viewer="back" ${ui.resourceHistoryIndex<=0?'disabled':''} aria-label="Back">← Back</button><button class="btn secondary sm" data-viewer="forward" ${ui.resourceHistoryIndex>=ui.resourceHistory.length-1?'disabled':''} aria-label="Forward">Forward →</button><button class="btn secondary sm" data-viewer="reload">⟳ Reload</button><button class="btn secondary sm" data-viewer="home">⌂ Home</button><form id="viewerUrlForm" class="viewer-url-form"><input class="input" id="viewerUrl" aria-label="Website URL" value="${esc(u)}" placeholder="https://example.com" inputmode="url" required><button class="btn sm" type="submit">Go</button></form><button class="btn secondary sm" data-viewer="external">Open externally ↗</button></div><div class="viewer-statusbar"><span class="viewer-clock"><span id="viewerTime">--:--:--</span> · <span id="viewerDate">Loading date…</span></span><span>Focused time: <strong id="viewerWatch">00:00:00</strong> <button type="button" data-watch="toggle" id="viewerWatchToggle">Start</button> <button type="button" data-watch="reset">Reset</button></span></div><div class="viewer-notice"><strong>Embedding depends on the destination.</strong> Some sites block iframes, show anti-bot checks, or require a separate login. AdarshX cannot bypass these restrictions; use Open externally for verification or sign-in.</div><iframe id="resourceFrame" title="Embedded resource website" src="${esc(u)}" loading="eager" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-forms allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox" allow="fullscreen; autoplay"></iframe></section>`}
function resourceFolders(){let current=ui.resFolder||'All',q=(ui.resQuery||'').toLowerCase(),subject=ui.resSubject||'All',sort=ui.resSort||'title',list=state.resources.filter(r=>(current==='All'||r.folderId===current)&&(subject==='All'||r.subjectTag===subject||subName(r.subjectId)===subject)&&(!q||(r.title+' '+r.description+' '+r.url).toLowerCase().includes(q))).sort((a,b)=>sort==='date'?(b.created||0)-(a.created||0):a.title.localeCompare(b.title));return `${head('YOUR RESOURCE SHELF','Resources','Open saved links in the in-app viewer when the destination permits embedding.',button('＋ Add resource','new-resource'))}${resourceViewer()}<section class="card pad"><div class="toolbar"><button class="btn secondary sm" data-action="folder-add">＋ New folder</button><button class="action" data-action="folder-rename">Rename selected</button><button class="action" data-action="folder-delete">Delete selected</button><select class="select" id="resFolder" style="width:auto"><option value="All">All folders</option>${state.folders.map(f=>`<option value="${f.id}" ${current===f.id?'selected':''}>${esc(f.name)} (${state.resources.filter(r=>r.folderId===f.id).length})</option>`).join('')}</select><select class="select" id="resSubject" style="width:auto"><option>All</option>${['Mathematics','Science','SST','English','Hindi','IT','General'].map(x=>`<option ${subject===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" id="resSort" style="width:auto"><option value="title" ${sort==='title'?'selected':''}>Title A–Z</option><option value="date" ${sort==='date'?'selected':''}>Newest</option></select><input class="input" id="resQuery" placeholder="Search resources…" value="${esc(ui.resQuery||'')}" style="width:170px"></div><div class="grid syllabus-grid" style="margin-top:14px">${list.map(r=>`<article class="card pad"><div class="card-head"><span class="pill violet">${esc(state.folders.find(f=>f.id===r.folderId)?.name||'General')}</span><button class="action" data-action="delete-resource" data-id="${r.id}">Delete</button></div><h3>${esc(r.title)}</h3><p class="subtext">${esc(r.description||'')}</p><small class="muted">${esc(r.url)}</small><div class="toolbar" style="margin-top:12px"><button class="btn secondary sm" data-resource-open="${r.id}">↗ Open inside AdarshX</button><button class="action" data-action="edit-resource" data-id="${r.id}">Edit details</button><select class="select" data-move-resource="${r.id}" style="width:auto">${state.folders.map(f=>`<option value="${f.id}" ${(r.folderId||'')===f.id?'selected':''}>Move: ${esc(f.name)}</option>`).join('')}</select></div></article>`).join('')}</div>${list.length?'':empty('No resources in this view','Add a website, video, PDF link, or study material.',button('＋ Add resource','new-resource'))}</section>`}
function playAlarm(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C){toast('Audio is not supported in this browser.','error');return false}let c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},700);return true}catch{toast('Could not play alarm sound.','error');return false}}
function alarmEditor(){let body=field('title','Alarm title','text','Study time',{required:true})+field('time','Time','time','18:00',{required:true})+field('repeat','Repeat','select','One-time',{options:['One-time','Daily','Weekdays','Weekends','Custom weekdays'].map(x=>`<option>${x}</option>`).join('')})+field('date','Date (one-time)','date',iso())+`<div class="field full"><label><input type="checkbox" name="sound" checked> Sound enabled</label></div><div class="field full"><label>Custom weekdays (for Custom weekdays)</label><div class="toolbar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<label class="pill"><input type="checkbox" name="days" value="${i===6?0:i+1}"> ${d}</label>`).join('')}</div></div>`;modal('Add alarm',body,'Save alarm',(d,fd)=>{if(!d.time||!d.title.trim())return false;state.alarms.push({id:id(),title:d.title.trim(),time:d.time,repeat:d.repeat,date:d.date,days:fd.getAll('days').map(Number),sound:fd.has('sound'),enabled:true,lastFired:''});save();toast('Alarm saved');return true})}
let firedAlarmMinute='';setInterval(()=>{let now=new Date(),minute=iso(now)+'T'+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');if(minute===firedAlarmMinute)return;firedAlarmMinute=minute;state.alarms.forEach(a=>{if(!a.enabled||a.time!==minute.slice(11))return;let day=now.getDay(),matches=a.repeat==='Daily'||a.repeat==='Weekdays'&&day>=1&&day<=5||a.repeat==='Weekends'&&(day===0||day===6)||a.repeat==='Custom weekdays'&&(a.days||[]).includes(day)||a.repeat==='One-time'&&a.date===iso(now);if(matches&&a.lastFired!==minute){a.lastFired=minute;if(a.sound)playAlarm();if('Notification'in window&&Notification.permission==='granted')new Notification('AdarshX alarm',{body:a.title});else toast('⏰ '+a.title);if(a.repeat==='One-time')a.enabled=false;save()}})},1000);
renderers.syllabus=syllabusPage;renderers.resources=resourceFolders;

function initial(){let p=location.hash.slice(1);if(meta[p])page=p;if(timer.status==='running'){timer.interval=setInterval(tick,250);if(timer.mode!=='stopwatch'&&timer.remaining<=0)tick()}go(page);if(!state.onboarded)welcome()}
initial();
})();
</script></body></html>
